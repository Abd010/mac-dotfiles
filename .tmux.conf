# -----------------------------------------------------------------------------
# PLUGINS (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# -----------------------------------------------------------------------------
# 0. ENHANCED KEYS & PROTOCOLS (Kitty Protocol)
# -----------------------------------------------------------------------------
# Enable the Kitty keyboard protocol for enhanced key combinations
set -s extended-keys on

# Allow applications (like Neovim) to request the protocol
set -as terminal-features 'xterm-256color:extkeys'

# -----------------------------------------------------------------------------
# 1. FIX THE PREFIX KEY
# -----------------------------------------------------------------------------
# The default 'Ctrl-b' is hard to reach. Let's change it to 'Ctrl-a'.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# 2. INTUITIVE SPLITTING
# -----------------------------------------------------------------------------
# Use | for vertical split and - for horizontal (top-bottom).
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# -----------------------------------------------------------------------------
# 3. MOUSE SUPPORT
# -----------------------------------------------------------------------------
set -g mouse on

# -----------------------------------------------------------------------------
# 4. QUALITY OF LIFE
# -----------------------------------------------------------------------------
# Start window numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Make colors look right in Neovim (true color support)
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

# Reduce escape delay for Neovim
set -sg escape-time 10

# Enable focus events for autoread in Neovim
set -g focus-events on

# -----------------------------------------------------------------------------
# 5. EASY RELOAD
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# -----------------------------------------------------------------------------
# 6. VI-STYLE COPY MODE
# -----------------------------------------------------------------------------
# Use vi keys in copy mode (mirrors Neovim muscle memory)
setw -g mode-keys vi

# Enter copy mode with prefix + v
bind-key v copy-mode

# 'v' to begin selection, 'y' to yank — just like Neovim visual mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# '{' and '}' to jump between paragraphs (empty lines) — mirrors Neovim
bind-key -T copy-mode-vi } search-forward "^$"
bind-key -T copy-mode-vi { search-backward "^$"

# -----------------------------------------------------------------------------
# PLUGIN CONFIGURATION
# -----------------------------------------------------------------------------

# Catppuccin Mocha theme
set -g @catppuccin_flavour 'mocha'

# Resurrect — capture pane contents on save
set -g @resurrect-capture-pane-contents 'on'

# Continuum — auto-save every 15 mins, auto-restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# -----------------------------------------------------------------------------
# SESSIONIZER
# -----------------------------------------------------------------------------
bind-key f display-popup -E tmux-sessionizer

# -----------------------------------------------------------------------------
# INITIALIZE TPM (keep this line at the very bottom)
# -----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
