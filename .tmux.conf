# -----------------------------------------------------------------------------
# PLUGINS (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# -----------------------------------------------------------------------------
# 0. ENHANCED KEYS & PROTOCOLS (Kitty Protocol)
# -----------------------------------------------------------------------------
# Enable the Kitty keyboard protocol for enhanced key combinations
set -s extended-keys on

# Allow applications (like Neovim) to request the protocol
set -as terminal-features 'xterm-256color:extkeys'

# -----------------------------------------------------------------------------
# 1. FIX THE PREFIX KEY
# -----------------------------------------------------------------------------
# The default 'Ctrl-b' is hard to reach. Let's change it to 'Ctrl-a'.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# 2. INTUITIVE SPLITTING
# -----------------------------------------------------------------------------
# Use | for vertical split and - for horizontal (top-bottom).
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Join a window into the current one as a side-by-side split.
# Press prefix + j, then enter the window number.
bind j command-prompt -p "Join pane from window:" "join-pane -h -s ':%%'"

# Break the current pane out into its own window without following it
# (keeps focus on the remaining pane — nicer than the default prefix + !).
bind b break-pane -d

# -----------------------------------------------------------------------------
# 2b. REORDERING WINDOWS
# -----------------------------------------------------------------------------
# Primary: vim-style home-row. Parallel to vim-tmux-navigator's C-h/C-l —
# plain Ctrl navigates, Ctrl+Shift moves the thing. Needs extended-keys on.
bind-key -n C-S-h swap-window -t -1 \; previous-window
bind-key -n C-S-l swap-window -t +1 \; next-window

# Secondary: tiling-WM / browser-tab convention.
bind-key -n C-S-Left  swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Fallback: prefix + < / > (vim shift-left/right mnemonic), repeatable with -r.
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# -----------------------------------------------------------------------------
# 3. MOUSE SUPPORT
# -----------------------------------------------------------------------------
set -g mouse on

# -----------------------------------------------------------------------------
# 4. QUALITY OF LIFE
# -----------------------------------------------------------------------------
# Start window numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Make colors look right in Neovim (true color support)
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

# Reduce escape delay for Neovim
set -sg escape-time 10

# Enable focus events for autoread in Neovim
set -g focus-events on

# -----------------------------------------------------------------------------
# 5. EASY RELOAD
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# -----------------------------------------------------------------------------
# 6. VI-STYLE COPY MODE
# -----------------------------------------------------------------------------
# Use vi keys in copy mode (mirrors Neovim muscle memory)
setw -g mode-keys vi

# Enter copy mode with prefix + v
bind-key v copy-mode

# 'v' to begin selection, 'y' to yank — just like Neovim visual mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# -----------------------------------------------------------------------------
# PLUGIN CONFIGURATION
# -----------------------------------------------------------------------------

# Catppuccin Mocha theme
set -g @catppuccin_flavour 'mocha'

# Resurrect — capture pane contents on save
set -g @resurrect-capture-pane-contents 'on'
# Move resurrect's manual-save off prefix+C-s (now the session-view cycle) to
# prefix+S. Continuum still auto-saves every 15 min, so this is rarely needed.
set -g @resurrect-save 'S'

# Continuum — auto-save every 15 mins, auto-restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# -----------------------------------------------------------------------------
# SESSIONIZER
# -----------------------------------------------------------------------------
bind-key f display-popup -E tmux-sessionizer

# -----------------------------------------------------------------------------
# SESSION VIEWS  (office / personal / all) — filters the prefix+s session list
# -----------------------------------------------------------------------------
# Sticky view; sessions are classified live by their panes' cwd, so it
# survives tmux-continuum restores (no per-session tagging needed). Config dirs
# (~/.config/*, ~/mac-dotfiles) appear in every view. The filter branches on
# @session_view and is stored once here, then reused via #{E:...}
# (double-expansion) by both bindings below.
# choose-tree evaluates -f once per pane (pane_format=1) and keeps a session if
# any of its panes match. Gotcha: if NOTHING matches, tmux silently drops the
# filter and lists every session, so a filter that's always 0 looks like "no
# filtering". Don't guard on pane_format/window_format.
set -g @session_view 'office'
set -g @sv_filter '#{?#{==:#{@session_view},all},1,#{?#{==:#{@session_view},personal},#{||:#{m:*/hanger/*,#{pane_current_path}},#{||:#{m:*/.config/*,#{pane_current_path}},#{m:*/mac-dotfiles*,#{pane_current_path}}}},#{||:#{m:/opt/workspace/*,#{pane_current_path}},#{||:#{m:*/.config/*,#{pane_current_path}},#{m:*/mac-dotfiles*,#{pane_current_path}}}}}}'

# prefix + s   : open the session tree, filtered to the current view.
bind s choose-tree -Zs -f '#{E:@sv_filter}'

# prefix + C-s : cycle office -> personal -> all, then re-open the (now
# re-filtered) switcher so the change shows immediately.
# (Resurrect's manual-save moves to prefix+S below; continuum still auto-saves.)
# If the switcher is already open, quit it first: choose-tree on a pane already
# in tree mode just re-fronts the existing tree and keeps its old filter.
bind C-s if-shell -F '#{==:#{@session_view},office}' \
  { set -g @session_view personal } \
  { if-shell -F '#{==:#{@session_view},personal}' \
      { set -g @session_view all } \
      { set -g @session_view office } } \; \
  if-shell -F '#{pane_in_mode}' { send-keys q } \; \
  choose-tree -Zs -f '#{E:@sv_filter}'

# -----------------------------------------------------------------------------
# INITIALIZE TPM (keep this line at the very bottom)
# -----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'

# --- current session view indicator (AFTER the tpm run line so no plugin
# overrides it) ---
# On the LEFT so it stays visible on the choose-tree switcher page and isn't
# clipped. Colour: office=yellow, personal=blue, all=green (tmux colour names).
# Full value with set -g (not -ag append), so re-sourcing doesn't stack copies.
set -g status-left-length 100
set -g status-left '[#{session_name}] #[none,bold,fg=#{?#{==:#{@session_view},personal},blue,#{?#{==:#{@session_view},all},green,yellow}}] [#{@session_view}] '
